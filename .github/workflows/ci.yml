name: CI

# Se ejecuta en cada push a master y en cada pull request hacia master
on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  # ---------------------------------------------------------------
  # Job 1: tests unitarios y de integracion (proyecto net9.0 comun)
  # Se prueba en Linux y en Windows con una matriz (matrix)
  # ---------------------------------------------------------------
  test:
    name: Tests (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache de paquetes NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-

      - name: Restaurar dependencias
        run: dotnet restore FitArmLog.Tests/FitArmLog.Tests.csproj

      - name: Compilar
        run: dotnet build FitArmLog.Tests/FitArmLog.Tests.csproj -c Release --no-restore

      - name: Ejecutar tests
        run: dotnet test FitArmLog.Tests/FitArmLog.Tests.csproj -c Release --no-build --logger "trx;LogFileName=test-results.trx" --results-directory TestResults

      - name: Guardar resultados de los tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results-${{ matrix.os }}
          path: TestResults/*.trx

  # ---------------------------------------------------------------
  # Job 2: compilar la app Android y guardar el APK como artefacto
  # Solo corre si los tests pasaron (needs: test)
  # ---------------------------------------------------------------
  build-android:
    name: Build Android (APK)
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Cache de paquetes NuGet
        uses: actions/cache@v4
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-maui-nuget-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-maui-nuget-

      - name: Instalar workload de MAUI para Android
        run: dotnet workload install maui-android

      - name: Publicar APK (Release)
        run: dotnet publish FitArmLog.csproj -f net9.0-android -c Release -p:AndroidPackageFormat=apk

      - name: Guardar el APK
        uses: actions/upload-artifact@v4
        with:
          name: fitarmlog-apk
          path: '**/publish/*.apk'
          if-no-files-found: warn
