name: Release

# Se ejecuta SOLO al crear un tag de version (ej: v1.0.0), siguiendo SemVer
on:
  push:
    tags:
      - 'v*'

# Permiso necesario para que el workflow pueda crear el Release en GitHub
permissions:
  contents: write

jobs:
  release:
    name: Generar APK y publicar Release
    runs-on: ubuntu-latest

    steps:
      - name: Descargar el codigo
        uses: actions/checkout@v4

      - name: Instalar Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Instalar .NET 9
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Instalar workload de MAUI para Android
        run: dotnet workload install maui-android

      # La version sale del tag: v1.2.0 -> 1.2.0
      - name: Calcular version
        run: echo "APP_VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV"

      - name: Publicar APK (Release)
        run: >
          dotnet publish FitArmLog.csproj -f net9.0-android -c Release
          -p:TargetFrameworks=net9.0-android
          -p:AndroidPackageFormat=apk
          -p:ApplicationDisplayVersion=${{ env.APP_VERSION }}
          -p:ApplicationVersion=${{ github.run_number }}

      - name: Renombrar el APK con la version
        run: |
          APK=$(find . -path '*publish*' -name '*.apk' | head -n 1)
          echo "APK encontrado: $APK"
          cp "$APK" "FitArmLog-${GITHUB_REF_NAME}.apk"

      # GITHUB_TOKEN lo provee GitHub solo; no hay que crear ningun secret
      - name: Crear el Release y adjuntar el APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "$GITHUB_REF_NAME" "FitArmLog-${GITHUB_REF_NAME}.apk" --title "FitArmLog $GITHUB_REF_NAME" --generate-notes
